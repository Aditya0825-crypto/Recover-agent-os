version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: recovery_os_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: recovery_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Celery tasks & caching
  redis:
    image: redis:7-alpine
    container_name: recovery_os_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend REST API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: recovery_os_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/recovery_os
      - REDIS_URL=redis://redis:6379/0
      - API_V1_STR=/api/v1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./ml_pipeline:/app/ml_pipeline
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # Celery Background Worker
  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: recovery_os_celery_worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/recovery_os
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./ml_pipeline:/app/ml_pipeline
    command: ["celery", "-A", "backend.app.core.celery_app.celery_app", "worker", "--loglevel=info"]

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recovery_os_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
